<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cliente — Garimpei</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="topbar">
    <button class="topbar__burger" id="burger" aria-label="Menu">☰</button>
    <span class="topbar__brand">👗 Garimpei</span>
  </div>
  <div class="backdrop" id="backdrop"></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="content">
      <div class="page-header">
        <div>
          <h1 id="titulo">Novo cliente</h1>
          <p>Preencha os dados do cliente</p>
        </div>
      </div>

      <div class="card">
        <form class="form" id="form" novalidate>
          <div class="campo">
            <label for="nome">Nome *</label>
            <input type="text" id="nome" maxlength="120" />
            <span class="erro-inline" data-erro="nome"></span>
          </div>
          <div class="form-linha">
            <div class="campo">
              <label for="telefone">Telefone</label>
              <input type="text" id="telefone" maxlength="20" placeholder="(11) 99999-0000" />
            </div>
            <div class="campo">
              <label for="email">E-mail</label>
              <input type="email" id="email" maxlength="120" />
              <span class="erro-inline" data-erro="email"></span>
            </div>
          </div>
          <div class="form-acoes">
            <button type="submit" class="btn btn--primario" id="btn-salvar">Salvar</button>
            <a class="btn btn--secundario" href="/pages/clientes.html">Cancelar</a>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/cliente-form.js"></script>
</body>
</html>
